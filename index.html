<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syllabus AI</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --user-msg: #3b82f6;
            --ai-msg: #334155;
            --text-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #334155;
            background: var(--chat-bg);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        .user {
            align-self: flex-end;
            background-color: var(--user-msg);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .ai {
            align-self: flex-start;
            background-color: var(--ai-msg);
            color: var(--text-color);
            border-bottom-left-radius: 2px;
            border: 1px solid #475569;
        }

        .input-area {
            padding: 20px;
            background: var(--chat-bg);
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: var(--bg-color);
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: var(--user-msg);
        }

        button {
            padding: 0 25px;
            background: var(--user-msg);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: #2563eb;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🚀 Syllabus ChatBot</h2>
    </div>

    <div class="chat-container" id="chatBox">
        <div class="message ai">Hello! I am restricted to your syllabus. Ask me anything.</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your question..." onkeypress="handleEnter(event)">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        
        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const question = inputField.value.trim();
            if (!question) return;

            // 1. Add User Message
            addMessage(question, 'user');
            inputField.value = '';

            // 2. Simulate Loading (or fetch API)
            // const response = await fetch('/api/chat', { method: 'POST', body: JSON.stringify({query: question}) });
            // const data = await response.json();
            
            setTimeout(() => {
                addMessage("This is a strict answer based on the syllabus context.", 'ai');
            }, 1000);
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.classList.add('message', sender);
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
